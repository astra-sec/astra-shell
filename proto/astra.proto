syntax = "proto3";

package astra.v1;

import "terminal_state_v2.proto";

message WireMessage {
  oneof body {
    ServerHello server_hello = 1;
    AuthRequest auth_request = 2;
    AuthResult auth_result = 3;
    Request request = 4;
    Response response = 5;
    TerminalCommand terminal_command = 6;
    TerminalEvent terminal_event = 7;
    ClientHello client_hello = 8;
    // Gateway-to-worker metadata. Network clients must never send this.
    WorkerStreamHello worker_stream_hello = 9;
  }
}

message ClientHello {
  // Legacy exact-version hint. New clients keep this at 1 so an N-1 server can
  // parse and accept the hello, then advertise their real range below.
  uint32 protocol_version = 1;
  string username = 2;
  uint32 minimum_protocol_version = 3;
  uint32 maximum_protocol_version = 4;
  repeated CapabilityOffer capabilities = 5;
}
message ServerHello {
  // The version selected from the client/server overlap.
  uint32 protocol_version = 1;
  bytes challenge = 2;
  string server_instance = 3;
  repeated CapabilitySelection capabilities = 4;
}
message CapabilityOffer {
  string name = 1;
  uint32 minimum_version = 2;
  uint32 maximum_version = 3;
}
message CapabilitySelection {
  string name = 1;
  uint32 version = 2;
}
message WorkerStreamHello {
  uint32 protocol_version = 1;
  repeated CapabilitySelection capabilities = 2;
  // Generated by the authenticated gateway. Network clients cannot choose it.
  string connection_id = 3;
}
message AuthRequest {
  string public_key = 1;
  string signature_pem = 2;
}
message AuthResult {
  bool ok = 1;
  string message = 2;
  // Stable machine-readable failure code. Empty for success and legacy servers.
  string error_code = 3;
}

message Request {
  string request_id = 1;
  oneof command {
    ListRequest list = 10;
    SpawnRequest spawn = 11;
    AttachRequest attach = 12;
    CloseRequest close = 13;
    FileCapabilitiesRequest file_capabilities = 14;
    FileStatRequest file_stat = 15;
    FileListRequest file_list = 16;
    BeginUploadRequest begin_upload = 17;
    WriteFileChunkRequest write_file_chunk = 18;
    QueryUploadRequest query_upload = 19;
    CommitUploadRequest commit_upload = 20;
    AbortUploadRequest abort_upload = 21;
    BeginDownloadRequest begin_download = 22;
    ReadFileChunkRequest read_file_chunk = 23;
    MakeDirectoryRequest make_directory = 24;
    RemoveFileRequest remove_file = 25;
    RenameFileRequest rename_file = 26;
    GitStatusRequest git_status = 27;
    WatchFilesRequest watch_files = 28;
    RenameTerminalRequest rename_terminal = 29;
    ListWorkspacesRequest list_workspaces = 30;
    CreateWorkspaceRequest create_workspace = 31;
    RenameWorkspaceRequest rename_workspace = 32;
    DeleteWorkspaceRequest delete_workspace = 33;
    ListTerminalsRequest list_terminals = 34;
    ListAttachmentsRequest list_attachments = 35;
  }
}
message ListRequest {}
message SpawnRequest {
  string name = 1;
  repeated string argv = 2;
  string cwd = 3;
  uint32 rows = 4;
  uint32 cols = 5;
  string term = 6;
  repeated EnvironmentVariable environment = 7;
  // Required when session.objects v1 is negotiated. Legacy clients map to
  // the daemon's default Workspace.
  string workspace_id = 8;
}
message EnvironmentVariable {
  string name = 1;
  string value = 2;
}
message AttachRequest {
  string terminal_id = 1;
  bool read_only = 2;
  bool takeover = 3;
  // Opaque capability returned by a previous writable attach. A matching token safely resumes
  // that writer while rotating the fencing lease ID, so delayed cleanup of the old stream cannot
  // release the new attachment.
  string resume_token = 4;
  string workspace_id = 5;
}
message CloseRequest {
  string terminal_id = 1;
  string workspace_id = 2;
}
message RenameTerminalRequest {
  string terminal_id = 1;
  // Empty clears the user-defined name and restores the program-reported title in clients.
  string name = 2;
  string workspace_id = 3;
}

message ListWorkspacesRequest {}
message CreateWorkspaceRequest { string name = 1; }
message RenameWorkspaceRequest {
  string workspace_id = 1;
  string name = 2;
}
message DeleteWorkspaceRequest { string workspace_id = 1; }
message ListTerminalsRequest {
  string workspace_id = 1;
  bool include_exited = 2;
}
message ListAttachmentsRequest {
  string workspace_id = 1;
  // Empty lists all active attachments in the Workspace.
  string terminal_id = 2;
}

// Astra Files/1 uses stable client-generated transfer IDs and offset-addressed chunks rather than
// connection-scoped file handles. Repeating BeginUpload or WriteFileChunk after reconnect is safe.
message FileCapabilitiesRequest {}
message FileStatRequest {
  bytes path = 1;
  bool follow_symlinks = 2;
}
message FileListRequest {
  bytes path = 1;
  bytes cursor = 2;
  uint32 limit = 3;
}
message BeginUploadRequest {
  string transfer_id = 1;
  bytes path = 2;
  uint64 size = 3;
  bytes sha256 = 4;
  bool overwrite = 5;
  uint32 mode = 6;
}
message WriteFileChunkRequest {
  string transfer_id = 1;
  uint64 offset = 2;
  bytes data = 3;
  bytes sha256 = 4;
}
message QueryUploadRequest { string transfer_id = 1; }
message CommitUploadRequest { string transfer_id = 1; }
message AbortUploadRequest { string transfer_id = 1; }
message BeginDownloadRequest {
  bytes path = 1;
  bool want_sha256 = 2;
}
message ReadFileChunkRequest {
  bytes path = 1;
  bytes snapshot = 2;
  uint64 offset = 3;
  uint32 length = 4;
}
message MakeDirectoryRequest { bytes path = 1; }
message RemoveFileRequest { bytes path = 1; }
message RenameFileRequest {
  bytes source = 1;
  bytes destination = 2;
  bool overwrite = 3;
}
message GitStatusRequest { bytes path = 1; }
message WatchFilesRequest { repeated bytes paths = 1; }

message Response {
  string request_id = 1;
  oneof result {
    ListResponse list = 10;
    SpawnResponse spawn = 11;
    AttachResponse attach = 12;
    AckResponse ack = 13;
    ErrorResponse error = 14;
    FileCapabilitiesResponse file_capabilities = 15;
    FileStatResponse file_stat = 16;
    FileListResponse file_list = 17;
    UploadStatusResponse upload_status = 18;
    BeginDownloadResponse begin_download = 19;
    FileChunkResponse file_chunk = 20;
    GitStatusResponse git_status = 21;
    FileChangesResponse file_changes = 22;
    WorkspaceListResponse workspace_list = 23;
    WorkspaceResponse workspace = 24;
    TerminalListResponse terminal_list = 25;
    AttachmentListResponse attachment_list = 26;
  }
}
enum TerminalLifecycle {
  TERMINAL_LIFECYCLE_UNSPECIFIED = 0;
  TERMINAL_LIFECYCLE_CREATING = 1;
  TERMINAL_LIFECYCLE_RUNNING = 2;
  TERMINAL_LIFECYCLE_EXITED = 3;
  TERMINAL_LIFECYCLE_ARCHIVED = 4;
}
message TerminalInfo {
  // Canonical identity. Clients must persist and use this for automatic resume.
  string id = 1;
  string name = 2;
  repeated string argv = 3;
  string cwd = 4;
  string status = 5;
  optional int32 exit_code = 6;
  uint32 rows = 7;
  uint32 cols = 8;
  // Human-facing number scoped to one user worker lifecycle. Zero means absent.
  uint64 display_id = 9;
  // User-defined persistent label. Absent means clients should use the program-reported title.
  optional string custom_name = 10;
  optional bool interactive = 11;
  string workspace_id = 12;
  TerminalLifecycle lifecycle = 13;
}
message ListResponse { repeated TerminalInfo terminals = 1; }
message SpawnResponse { TerminalInfo terminal = 1; }
message WorkspaceInfo {
  string id = 1;
  string name = 2;
  uint64 revision = 3;
  uint64 created_at_unix_ms = 4;
  bool is_default = 5;
}
message WorkspaceListResponse { repeated WorkspaceInfo workspaces = 1; }
message WorkspaceResponse { WorkspaceInfo workspace = 1; }
message TerminalListResponse { repeated TerminalInfo terminals = 1; }
enum AttachmentRole {
  ATTACHMENT_ROLE_UNSPECIFIED = 0;
  ATTACHMENT_ROLE_VIEWER = 1;
  ATTACHMENT_ROLE_CONTROLLER = 2;
}
enum AttachmentState {
  ATTACHMENT_STATE_UNSPECIFIED = 0;
  ATTACHMENT_STATE_SUBSCRIBING = 1;
  ATTACHMENT_STATE_SNAPSHOTTING = 2;
  ATTACHMENT_STATE_LIVE = 3;
}
message AttachmentInfo {
  string id = 1;
  string connection_id = 2;
  string workspace_id = 3;
  string terminal_id = 4;
  AttachmentRole role = 5;
  AttachmentState state = 6;
  uint64 created_at_unix_ms = 7;
}
message AttachmentListResponse { repeated AttachmentInfo attachments = 1; }

// Persisted server metadata. It is not a client RPC payload.
message SessionCatalog {
  uint32 schema_version = 1;
  string default_workspace_id = 2;
  repeated WorkspaceInfo workspaces = 3;
}
message TerminalSnapshot {
  uint32 rows = 1;
  uint32 cols = 2;
  // Escape sequences that reconstruct the authoritative visible screen.
  bytes contents = 3;
  bool alternate_screen = 4;
  // Normal-screen backing grid while contents represents the alternate screen.
  bytes normal_contents = 5;
}
message AttachResponse {
  TerminalInfo terminal = 1;
  string lease_id = 2;
  bool read_only = 3;
  bytes history = 4;
  // Stable across automatic reconnects for one writer; empty for read-only attachments.
  string resume_token = 5;
  TerminalSnapshot snapshot = 6;
  AttachmentInfo attachment = 7;
  // Non-zero only for a writable attachment that negotiated terminal.input_lease v1.
  uint32 lease_ttl_ms = 8;
}
message AckResponse { string message = 1; }
message ErrorResponse {
  string code = 1;
  string message = 2;
}

message FileCapabilitiesResponse {
  uint32 version = 1;
  uint32 max_chunk_size = 2;
  bool resumable_uploads = 3;
  bool atomic_upload_commit = 4;
  bool chunk_sha256 = 5;
  bool file_watch_events = 6;
}
enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_REGULAR = 1;
  FILE_KIND_DIRECTORY = 2;
  FILE_KIND_SYMLINK = 3;
  FILE_KIND_OTHER = 4;
}
message FileMetadata {
  // Unix paths are bytes so names that are not valid UTF-8 remain addressable.
  bytes path = 1;
  bytes name = 2;
  FileKind kind = 3;
  uint64 size = 4;
  uint32 mode = 5;
  int64 modified_unix_ns = 6;
}
message FileStatResponse { FileMetadata metadata = 1; }
message FileListResponse {
  repeated FileMetadata entries = 1;
  bytes next_cursor = 2;
}
message UploadStatusResponse {
  string transfer_id = 1;
  bytes path = 2;
  uint64 size = 3;
  uint64 committed_offset = 4;
  string state = 5;
}
message BeginDownloadResponse {
  FileMetadata metadata = 1;
  bytes snapshot = 2;
  bytes sha256 = 3;
  uint32 max_chunk_size = 4;
}
message FileChunkResponse {
  uint64 offset = 1;
  bytes data = 2;
  bytes sha256 = 3;
  bool eof = 4;
}
message GitFileStatus {
  // Path relative to repository_root. Status uses Git porcelain-v2 XY characters.
  bytes path = 1;
  string index_status = 2;
  string worktree_status = 3;
  bytes original_path = 4;
}
message GitStatusResponse {
  bytes repository_root = 1;
  string branch = 2;
  bool detached = 3;
  uint32 ahead = 4;
  uint32 behind = 5;
  repeated GitFileStatus files = 6;
}
message FileChange {
  bytes path = 1;
  string kind = 2;
}
message FileChangesResponse {
  repeated FileChange changes = 1;
  bool rescan_required = 2;
}

message TerminalCommand {
  string terminal_id = 1;
  string lease_id = 2;
  uint64 sequence = 3;
  string attachment_id = 4;
  oneof command {
    bytes input = 10;
    Resize resize = 11;
    bool detach = 12;
    astra.terminal.v2.HistoryPageRequest history_page = 13;
    LeaseControl lease_control = 14;
    TerminalStateAck state_ack = 15;
  }
}
message TerminalStateAck {
  bytes epoch = 1;
  uint64 generation = 2;
}
message LeaseControl {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    RENEW = 1;
    RELEASE = 2;
  }
  Action action = 1;
}
message Resize {
  uint32 rows = 1;
  uint32 cols = 2;
  // Physical size of the same text area. Both are zero when the client cannot
  // measure pixels; otherwise both must be non-zero.
  uint32 pixel_width = 3;
  uint32 pixel_height = 4;
}
message TerminalEvent {
  string terminal_id = 1;
  string attachment_id = 2;
  oneof event {
    bytes output = 10;
    int32 exited = 11;
    string error = 12;
    bool interactive = 13;
    TerminalSnapshot snapshot = 14;
    LeaseChanged lease_changed = 15;
    TerminalStateChunk semantic_state_chunk = 16;
    ClipboardWrite clipboard_write = 17;
    HistoryPageChunk history_page_chunk = 18;
    TerminalStateDiffChunk semantic_state_diff_chunk = 19;
  }
}
enum ClipboardSelection {
  CLIPBOARD_SELECTION_UNSPECIFIED = 0;
  CLIPBOARD_SELECTION_CLIPBOARD = 1;
  CLIPBOARD_SELECTION_PRIMARY = 2;
}
message ClipboardWrite {
  ClipboardSelection selection = 1;
  bytes contents = 2;
  bool clear = 3;
}
// One reliable fragment of an encoded astra.terminal.v2.State. The receiver
// validates size, ordering, digest and the complete State before publication.
message TerminalStateChunk {
  bytes transfer_id = 1;
  uint32 chunk_index = 2;
  uint32 chunk_count = 3;
  uint32 total_size = 4;
  bytes sha256 = 5;
  bytes data = 6;
}
// A cumulative semantic update from one client-acknowledged State generation
// to the latest generation. target_metadata carries every State field except
// Screen.included_rows; the ordered row sources reconstruct those two arrays.
message TerminalStateDiff {
  bytes epoch = 1;
  uint64 base_generation = 2;
  uint64 target_generation = 3;
  astra.terminal.v2.State target_metadata = 4;
  repeated TerminalStateRow primary_rows = 5;
  repeated TerminalStateRow alternate_rows = 6;
}
message TerminalStateRow {
  oneof source {
    astra.terminal.v2.Anchor base_anchor = 1;
    astra.terminal.v2.Row replacement = 2;
  }
}
// One reliable fragment of an encoded TerminalStateDiff.
message TerminalStateDiffChunk {
  bytes transfer_id = 1;
  uint32 chunk_index = 2;
  uint32 chunk_count = 3;
  uint32 total_size = 4;
  bytes sha256 = 5;
  bytes data = 6;
}
// One reliable fragment of an encoded astra.terminal.v2.HistoryPage.
message HistoryPageChunk {
  bytes transfer_id = 1;
  uint32 chunk_index = 2;
  uint32 chunk_count = 3;
  uint32 total_size = 4;
  bytes sha256 = 5;
  bytes data = 6;
}
message LeaseChanged {
  bool read_only = 1;
  string reason = 2;
  string lease_id = 3;
  uint32 lease_ttl_ms = 4;
}
