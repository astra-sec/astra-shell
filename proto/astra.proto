syntax = "proto3";

package astra.v1;

message WireMessage {
  oneof body {
    ServerHello server_hello = 1;
    AuthRequest auth_request = 2;
    AuthResult auth_result = 3;
    Request request = 4;
    Response response = 5;
    TerminalCommand terminal_command = 6;
    TerminalEvent terminal_event = 7;
    ClientHello client_hello = 8;
  }
}

message ClientHello {
  uint32 protocol_version = 1;
  string username = 2;
}
message ServerHello {
  uint32 protocol_version = 1;
  bytes challenge = 2;
  string server_instance = 3;
}
message AuthRequest {
  string public_key = 1;
  string signature_pem = 2;
}
message AuthResult {
  bool ok = 1;
  string message = 2;
}

message Request {
  string request_id = 1;
  oneof command {
    ListRequest list = 10;
    SpawnRequest spawn = 11;
    AttachRequest attach = 12;
    CloseRequest close = 13;
    FileCapabilitiesRequest file_capabilities = 14;
    FileStatRequest file_stat = 15;
    FileListRequest file_list = 16;
    BeginUploadRequest begin_upload = 17;
    WriteFileChunkRequest write_file_chunk = 18;
    QueryUploadRequest query_upload = 19;
    CommitUploadRequest commit_upload = 20;
    AbortUploadRequest abort_upload = 21;
    BeginDownloadRequest begin_download = 22;
    ReadFileChunkRequest read_file_chunk = 23;
    MakeDirectoryRequest make_directory = 24;
    RemoveFileRequest remove_file = 25;
    RenameFileRequest rename_file = 26;
  }
}
message ListRequest {}
message SpawnRequest {
  string name = 1;
  repeated string argv = 2;
  string cwd = 3;
  uint32 rows = 4;
  uint32 cols = 5;
  string term = 6;
  repeated EnvironmentVariable environment = 7;
}
message EnvironmentVariable {
  string name = 1;
  string value = 2;
}
message AttachRequest {
  string terminal_id = 1;
  bool read_only = 2;
  bool takeover = 3;
  // Opaque capability returned by a previous writable attach. A matching token safely resumes
  // that writer while rotating the fencing lease ID, so delayed cleanup of the old stream cannot
  // release the new attachment.
  string resume_token = 4;
}
message CloseRequest { string terminal_id = 1; }

// Astra Files/1 uses stable client-generated transfer IDs and offset-addressed chunks rather than
// connection-scoped file handles. Repeating BeginUpload or WriteFileChunk after reconnect is safe.
message FileCapabilitiesRequest {}
message FileStatRequest {
  bytes path = 1;
  bool follow_symlinks = 2;
}
message FileListRequest {
  bytes path = 1;
  bytes cursor = 2;
  uint32 limit = 3;
}
message BeginUploadRequest {
  string transfer_id = 1;
  bytes path = 2;
  uint64 size = 3;
  bytes sha256 = 4;
  bool overwrite = 5;
  uint32 mode = 6;
}
message WriteFileChunkRequest {
  string transfer_id = 1;
  uint64 offset = 2;
  bytes data = 3;
  bytes sha256 = 4;
}
message QueryUploadRequest { string transfer_id = 1; }
message CommitUploadRequest { string transfer_id = 1; }
message AbortUploadRequest { string transfer_id = 1; }
message BeginDownloadRequest {
  bytes path = 1;
  bool want_sha256 = 2;
}
message ReadFileChunkRequest {
  bytes path = 1;
  bytes snapshot = 2;
  uint64 offset = 3;
  uint32 length = 4;
}
message MakeDirectoryRequest { bytes path = 1; }
message RemoveFileRequest { bytes path = 1; }
message RenameFileRequest {
  bytes source = 1;
  bytes destination = 2;
  bool overwrite = 3;
}

message Response {
  string request_id = 1;
  oneof result {
    ListResponse list = 10;
    SpawnResponse spawn = 11;
    AttachResponse attach = 12;
    AckResponse ack = 13;
    ErrorResponse error = 14;
    FileCapabilitiesResponse file_capabilities = 15;
    FileStatResponse file_stat = 16;
    FileListResponse file_list = 17;
    UploadStatusResponse upload_status = 18;
    BeginDownloadResponse begin_download = 19;
    FileChunkResponse file_chunk = 20;
  }
}
message TerminalInfo {
  // Canonical identity. Clients must persist and use this for automatic resume.
  string id = 1;
  string name = 2;
  repeated string argv = 3;
  string cwd = 4;
  string status = 5;
  optional int32 exit_code = 6;
  uint32 rows = 7;
  uint32 cols = 8;
  // Human-facing number scoped to one user worker lifecycle. Zero means absent.
  uint64 display_id = 9;
}
message ListResponse { repeated TerminalInfo terminals = 1; }
message SpawnResponse { TerminalInfo terminal = 1; }
message AttachResponse {
  TerminalInfo terminal = 1;
  string lease_id = 2;
  bool read_only = 3;
  bytes history = 4;
  // Stable across automatic reconnects for one writer; empty for read-only attachments.
  string resume_token = 5;
}
message AckResponse { string message = 1; }
message ErrorResponse {
  string code = 1;
  string message = 2;
}

message FileCapabilitiesResponse {
  uint32 version = 1;
  uint32 max_chunk_size = 2;
  bool resumable_uploads = 3;
  bool atomic_upload_commit = 4;
  bool chunk_sha256 = 5;
}
enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_REGULAR = 1;
  FILE_KIND_DIRECTORY = 2;
  FILE_KIND_SYMLINK = 3;
  FILE_KIND_OTHER = 4;
}
message FileMetadata {
  // Unix paths are bytes so names that are not valid UTF-8 remain addressable.
  bytes path = 1;
  bytes name = 2;
  FileKind kind = 3;
  uint64 size = 4;
  uint32 mode = 5;
  int64 modified_unix_ns = 6;
}
message FileStatResponse { FileMetadata metadata = 1; }
message FileListResponse {
  repeated FileMetadata entries = 1;
  bytes next_cursor = 2;
}
message UploadStatusResponse {
  string transfer_id = 1;
  bytes path = 2;
  uint64 size = 3;
  uint64 committed_offset = 4;
  string state = 5;
}
message BeginDownloadResponse {
  FileMetadata metadata = 1;
  bytes snapshot = 2;
  bytes sha256 = 3;
  uint32 max_chunk_size = 4;
}
message FileChunkResponse {
  uint64 offset = 1;
  bytes data = 2;
  bytes sha256 = 3;
  bool eof = 4;
}

message TerminalCommand {
  string terminal_id = 1;
  string lease_id = 2;
  uint64 sequence = 3;
  oneof command {
    bytes input = 10;
    Resize resize = 11;
    bool detach = 12;
  }
}
message Resize {
  uint32 rows = 1;
  uint32 cols = 2;
}
message TerminalEvent {
  string terminal_id = 1;
  oneof event {
    bytes output = 10;
    int32 exited = 11;
    string error = 12;
  }
}
