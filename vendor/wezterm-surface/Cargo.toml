[package]
name = "wezterm-surface"
version = "0.1.0"
edition = "2018"
license = "MIT"
publish = false

[features]
default = []
std = ["fancy-regex/std", "wezterm-cell/std", "wezterm-escape-parser/std", "fixedbitset/std", "fancy-regex/perf", "fancy-regex/unicode"]
appdata = ["std"]
use_serde = ["serde"]
use_image = ["wezterm-cell/use_image"]

[dependencies]
bitflags = "2.0"
fancy-regex = { version = "0.14", default-features = false }
finl_unicode = { version = "1.3", git = "https://github.com/wez/finl_unicode.git", rev = "a1892f26245529f2ef3877a9ebd610c96cec07a6", default-features = false, features = ["categories", "grapheme_clusters"] }
fixedbitset = { version = "0.4", default-features = false }
ordered-float = { version = "4.1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
siphasher = "1.0.1"
unicode-segmentation = "1.12"
wezterm-bidi = { version = "=0.2.3", default-features = false }
wezterm-blob-leases = { version = "=0.1.1", optional = true }
wezterm-cell = { path = "../wezterm-cell" }
wezterm-char-props = { path = "../wezterm-char-props", default-features = false }
wezterm-color-types = { version = "=0.3.0", default-features = false }
wezterm-dynamic = { version = "=0.2.1" }
wezterm-escape-parser = { path = "../wezterm-escape-parser" }
wezterm-input-types = { version = "=0.1.0", default-features = false }
