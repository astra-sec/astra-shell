[package]
name = "astra-wezterm-term"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Astra's audited headless fork of wezterm-term"

[lib]
name = "astra_wezterm_term"

[features]
default = ["astra-headless"]
astra-headless = []
graphics = [
  "dep:humansize",
  "dep:image",
  "dep:lru",
  "dep:miniz_oxide",
  "termwiz/use_image",
  "wezterm-cell/use_image",
  "wezterm-escape-parser/use_image",
  "wezterm-escape-parser/kitty-shm",
  "wezterm-surface/use_image",
]
use_serde = [
  "termwiz/use_serde",
  "wezterm-cell/use_serde",
  "wezterm-escape-parser/use_serde",
  "wezterm-surface/use_serde",
]

[dependencies]
anyhow = "1.0"
bitflags = "1.3"
csscolorparser = "0.6"
downcast-rs = "1.0"
finl_unicode = { version = "1.3", git = "https://github.com/wez/finl_unicode.git", rev = "a1892f26245529f2ef3877a9ebd610c96cec07a6", default-features = false, features = ["categories", "grapheme_clusters"] }
hex = { version = "0.4", default-features = false }
humansize = { version = "2.1", optional = true }
image = { version = "0.25", optional = true }
lazy_static = "1.4"
log = "0.4"
lru = { version = "0.16", optional = true }
miniz_oxide = { version = "0.7", optional = true }
num-traits = { version = "0.2", default-features = false }
ordered-float = { version = "4.1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "rc"] }
terminfo = "0.9"
unicode-normalization = "0.1.24"
url = "2"

# Published core crates use exact releases. The three unpublished core crates
# are source mirrors from the same audited upstream commit, not Git workspace
# dependencies; this prevents Cargo from fetching WezTerm GUI/font submodules.
termwiz = { version = "=0.23.3", default-features = false }
wezterm-bidi = { version = "=0.2.3", default-features = false }
wezterm-cell = { path = "../wezterm-cell", features = ["std"] }
wezterm-dynamic = { version = "=0.2.1" }
wezterm-escape-parser = { path = "../wezterm-escape-parser", features = ["std"] }
wezterm-surface = { path = "../wezterm-surface", features = ["std", "appdata"] }
