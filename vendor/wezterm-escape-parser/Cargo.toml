[package]
name = "wezterm-escape-parser"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
std = ["vtparse/std", "thiserror/std", "hex/std"]
kitty-shm = ["dep:nix", "dep:winapi"]
use_serde = ["dep:serde", "wezterm-color-types/use_serde", "wezterm-blob-leases/serde", "bitflags/serde", "wezterm-input-types/serde"]
use_image = ["image", "dep:image"]
image = ["sha2", "wezterm-blob-leases"]
tmux_cc = ["dep:pest", "dep:pest_derive"]

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
bitflags = "2.0"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
image = { version = "0.25", optional = true }
log = "0.4"
nix = { version = "0.29", optional = true, features = ["mman", "fs"] }
num-derive = "0.4"
num-traits = { version = "0.2", default-features = false }
ordered-float = { version = "4.1", default-features = false }
pest = { version = "2.7", optional = true }
pest_derive = { version = "2.7", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
thiserror = { version = "2.0", default-features = false }
vtparse = { version = "=0.7.0", default-features = false, features = ["alloc"] }
wezterm-blob-leases = { version = "=0.1.1", optional = true }
wezterm-color-types = { version = "=0.3.0", default-features = false }
wezterm-dynamic = { version = "=0.2.1" }
wezterm-input-types = { version = "=0.1.0", default-features = false }

[target.'cfg(windows)'.dependencies.winapi]
version = "0.3.9"
optional = true
features = ["winbase", "winerror", "winnls", "winuser", "consoleapi", "handleapi", "fileapi", "synchapi", "memoryapi", "winnt", "impl-default"]
