[package]
name = "wezterm-cell"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
std = ["serde/std", "wezterm-char-props/std", "wezterm-escape-parser/std", "finl_unicode/std"]
use_serde = ["dep:serde", "wezterm-color-types/use_serde"]
use_image = ["dep:image", "dep:wezterm-blob-leases", "dep:log", "dep:ordered-float", "dep:sha2", "dep:thiserror"]

[dependencies]
finl_unicode = { version = "1.3", git = "https://github.com/wez/finl_unicode.git", rev = "a1892f26245529f2ef3877a9ebd610c96cec07a6", default-features = false, features = ["categories", "grapheme_clusters"] }
image = { version = "0.25", optional = true }
log = { version = "0.4", optional = true }
ordered-float = { version = "4.1", default-features = false, optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
thiserror = { version = "1.0", optional = true }
wezterm-blob-leases = { version = "=0.1.1", optional = true }
wezterm-char-props = { path = "../wezterm-char-props", default-features = false }
wezterm-color-types = { version = "=0.3.0", default-features = false }
wezterm-dynamic = { version = "=0.2.1" }
wezterm-escape-parser = { path = "../wezterm-escape-parser", default-features = false }
